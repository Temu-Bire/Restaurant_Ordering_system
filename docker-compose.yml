services:
  # PostgreSQL Database Container
  postgres:
    image: postgres:16-alpine
    container_name: arif-food-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: arif_food
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d arif_food"]
      interval: 5s
      timeout: 5s
      retries: 5

  # NestJS Backend API Container
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: arif-food-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/arif_food?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/arif_food?schema=public"
      DATABASE_URL_UNPOOLED: "postgresql://postgres:postgrespassword@postgres:5432/arif_food?schema=public"
      JWT_SECRET: "BSCkph9uxcUyRZE4iTzSJYi3DnKDmEhTpmQvbA84h2s="
      JWT_EXPIRES_IN: "7d"
      APP_URL: "http://localhost:3000"
      FRONTEND_URL: "http://localhost:80"
      CORS_ORIGINS: "http://localhost:80,http://localhost:5173"
      CHAPA_ENVIRONMENT: "TEST"
      CHAPA_SECRET_KEY: "${CHAPA_SECRET_KEY:-CHAPA_TEST_PRIV_demo}"
      CHAPA_PUBLIC_KEY: "${CHAPA_PUBLIC_KEY:-CHAPA_TEST_PUB_demo}"
      CHAPA_BASE_URL: "https://api.chapa.co/v1"
    ports:
      - "3000:3000"
    volumes:
      - backend_uploads:/app/uploads

  # React Frontend Container (Nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "http://localhost:3000/api"
    container_name: arif-food-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  postgres_data:
  backend_uploads:
