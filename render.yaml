services:
  - type: web
    name: arif-food-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: arif-food-db
          property: connectionString
      - key: DATABASE_URL_UNPOOLED
        fromDatabase:
          name: arif-food-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: CHAPA_ENVIRONMENT
        value: TEST
      - key: CHAPA_SECRET_KEY
        sync: false
      - key: CHAPA_PUBLIC_KEY
        sync: false

databases:
  - name: arif-food-db
    plan: free
    databaseName: arif_food
    user: postgres
